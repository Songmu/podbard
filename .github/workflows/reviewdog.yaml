name: reviewdog
on: [pull_request]
jobs:
  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: reviewdog/action-staticcheck@v1.33.0
      with:
        reporter: github-pr-review
        fail_on_error: true
  misspell:
    name: misspell
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: misspell
      uses: reviewdog/action-misspell@v1.30.2
      with:
        reporter: github-pr-review
        level: warning
        locale: "US"
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@v1.80.2
        with:
          reporter: github-pr-review
  actions-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify workflow lockfile
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
